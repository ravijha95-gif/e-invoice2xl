```yaml
name: Build E-Invoice Extractor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli

      - name: Verify Build Tools
        run: |
          java -version
          node --version
          npm --version
          bubblewrap --version
          sdkmanager --version

      - name: Check Android Project
        run: |
          if [ ! -f twa-manifest.json ]; then
            echo "ERROR: twa-manifest.json not found."
            exit 1
          fi

          if [ ! -f package.json ] && [ ! -f gradlew ]; then
            echo "ERROR: Generated Bubblewrap Android project not found."
            echo "Initialize the Bubblewrap project before running this workflow."
            exit 1
          fi

      - name: Build Signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            bubblewrap build
          fi

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find . -type f \
            -name '*signed*.apk' \
            -not -path './.git/*' \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -type f \
              -path '*/build/outputs/apk/release/*.apk' \
              -not -name '*unsigned*' \
              -print -quit)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No release APK found."
            find . -type f -name '*.apk' -print
            exit 1
          fi

          mkdir -p release
          cp "$APK_PATH" release/einvoice-extractor.apk
          echo "path=release/einvoice-extractor.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: einvoice-extractor-signed-apk
          path: release/einvoice-extractor.apk
          if-no-files-found: error
          retention-days: 14
```
